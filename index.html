<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Laser Shooter</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

body{
    margin:0;
    background:#050816;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

canvas{
    display:block;
    margin:auto;
    background:#080d25;
    border:3px solid #38bdf8;
    box-shadow:0 0 30px #0284c7;
}

#menu{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.75);
}

.panel{
    text-align:center;
    background:#111827;
    padding:35px;
    border-radius:20px;
    border:2px solid #38bdf8;
    box-shadow:0 0 40px #0284c7;
}

h1{
    color:#38bdf8;
    font-size:42px;
}

button{
    padding:14px 30px;
    border:0;
    border-radius:12px;
    background:#22c55e;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#4ade80;
}
</style>
</head>

<body>

<canvas id="game" width="900" height="600"></canvas>

<div id="menu">
    <div class="panel">
        <h1>🚀 LASER SHOOTER</h1>
        <p>เกมยิงเป้าหมายแบบอาร์เคด</p>
        <p>
            ⬅️ ➡️ / A D = เคลื่อนที่<br>
            SPACE หรือคลิก = ยิง
        </p>
        <button onclick="startGame()">เริ่มเกม</button>
    </div>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

let running = false;
let score = 0;
let lives = 3;
let level = 1;

let bullets = [];
let enemies = [];
let particles = [];
let stars = [];

const keys = {};

const player = {
    x: W/2 - 30,
    y: H - 80,
    w: 60,
    h: 40,
    speed: 7,
    cooldown: 0
};


// ======================
// ดาวพื้นหลัง
// ======================

for(let i=0;i<100;i++){

    stars.push({
        x:Math.random()*W,
        y:Math.random()*H,
        speed:1+Math.random()*3,
        size:Math.random()*2+1
    });
}


// ======================
// Keyboard
// ======================

document.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()] = true;

    if(e.code==="Space"){
        e.preventDefault();
        shoot();
    }

});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});


// ======================
// Mouse ยิง
// ======================

canvas.addEventListener("mousedown",()=>{
    shoot();
});


// ======================
// เริ่มเกม
// ======================

function startGame(){

    score=0;
    lives=3;
    level=1;

    bullets=[];
    enemies=[];
    particles=[];

    player.x=W/2-player.w/2;

    running=true;

    document.getElementById("menu").style.display="none";

    requestAnimationFrame(loop);
}


// ======================
// ยิงเลเซอร์
// ======================

function shoot(){

    if(!running) return;

    if(player.cooldown>0) return;

    bullets.push({

        x:player.x+player.w/2-3,
        y:player.y,
        w:6,
        h:20,
        speed:12

    });

    player.cooldown=12;
}


// ======================
// สร้างศัตรู
// ======================

let enemyTimer=0;

function spawnEnemy(){

    enemies.push({

        x:Math.random()*(W-55),
        y:-60,
        w:50,
        h:40,

        speed:
            2+
            Math.random()*2+
            level*.2,

        hp:1
    });
}


// ======================
// Particle
// ======================

function explosion(x,y){

    for(let i=0;i<20;i++){

        particles.push({

            x:x,
            y:y,

            vx:(Math.random()-.5)*8,
            vy:(Math.random()-.5)*8,

            life:30
        });

    }
}


// ======================
// Collision
// ======================

function hit(a,b){

    return(
        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y
    );
}


// ======================
// Update
// ======================

function update(){

    // ผู้เล่น

    if(keys["arrowleft"] || keys["a"]){
        player.x-=player.speed;
    }

    if(keys["arrowright"] || keys["d"]){
        player.x+=player.speed;
    }

    player.x=Math.max(
        0,
        Math.min(W-player.w,player.x)
    );

    if(player.cooldown>0){
        player.cooldown--;
    }


    // กระสุน

    for(let i=bullets.length-1;i>=0;i--){

        bullets[i].y-=bullets[i].speed;

        if(bullets[i].y<-30){
            bullets.splice(i,1);
        }

    }


    // ศัตรู

    enemyTimer--;

    if(enemyTimer<=0){

        spawnEnemy();

        enemyTimer=Math.max(
            18,
            55-level*3
        );
    }


    for(let i=enemies.length-1;i>=0;i--){

        let e=enemies[i];

        e.y+=e.speed;


        // ชนผู้เล่น

        if(hit(player,e)){

            lives--;

            explosion(
                e.x+e.w/2,
                e.y+e.h/2
            );

            enemies.splice(i,1);

            if(lives<=0){
                gameOver();
                return;
            }

            continue;
        }


        // หลุดด้านล่าง

        if(e.y>H){

            lives--;

            enemies.splice(i,1);

            if(lives<=0){
                gameOver();
                return;
            }

            continue;
        }


        // กระสุนชนศัตรู

        for(let j=bullets.length-1;j>=0;j--){

            if(hit(bullets[j],e)){

                score+=10;

                explosion(
                    e.x+e.w/2,
                    e.y+e.h/2
                );

                enemies.splice(i,1);
                bullets.splice(j,1);

                break;
            }
        }

    }


    // เพิ่มระดับ

    level=
        1+
        Math.floor(score/100);


    // Particle

    for(let i=particles.length-1;i>=0;i--){

        let p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.life--;

        if(p.life<=0){
            particles.splice(i,1);
        }
    }


    // ดาว

    stars.forEach(s=>{

        s.y+=s.speed;

        if(s.y>H){
            s.y=0;
            s.x=Math.random()*W;
        }

    });

}


// ======================
// วาดพื้นหลัง
// ======================

function drawBackground(){

    let gradient=
        ctx.createLinearGradient(0,0,0,H);

    gradient.addColorStop(0,"#020617");
    gradient.addColorStop(1,"#172554");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);


    stars.forEach(s=>{

        ctx.fillStyle="white";

        ctx.globalAlpha=.7;

        ctx.fillRect(
            s.x,
            s.y,
            s.size,
            s.size
        );

    });

    ctx.globalAlpha=1;
}


// ======================
// วาดผู้เล่น
// ======================

function drawPlayer(){

    // แสง

    ctx.shadowBlur=20;
    ctx.shadowColor="#22d3ee";

    // ลำตัว

    ctx.fillStyle="#0ea5e9";

    ctx.beginPath();

    ctx.moveTo(
        player.x+player.w/2,
        player.y-20
    );

    ctx.lineTo(
        player.x+player.w,
        player.y+player.h
    );

    ctx.lineTo(
        player.x,
        player.y+player.h
    );

    ctx.closePath();

    ctx.fill();


    // แกนพลังงาน

    ctx.fillStyle="#67e8f9";

    ctx.fillRect(
        player.x+25,
        player.y+8,
        10,
        25
    );

    ctx.shadowBlur=0;
}


// ======================
// วาดกระสุน
// ======================

function drawBullets(){

    bullets.forEach(b=>{

        ctx.shadowBlur=15;
        ctx.shadowColor="#22d3ee";

        ctx.fillStyle="#67e8f9";

        ctx.fillRect(
            b.x,
            b.y,
            b.w,
            b.h
        );

        ctx.shadowBlur=0;

    });

}


// ======================
// วาดศัตรู
// ======================

function drawEnemies(){

    enemies.forEach(e=>{

        ctx.shadowBlur=15;
        ctx.shadowColor="#ef4444";

        ctx.fillStyle="#ef4444";

        ctx.beginPath();

        ctx.moveTo(e.x+e.w/2,e.y);
        ctx.lineTo(e.x+e.w,e.y+e.h);
        ctx.lineTo(e.x,e.y+e.h);
        ctx.closePath();

        ctx.fill();


        ctx.fillStyle="#fca5a5";

        ctx.beginPath();

        ctx.arc(
            e.x+e.w/2,
            e.y+22,
            8,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;

    });

}


// ======================
// Particle
// ======================

function drawParticles(){

    particles.forEach(p=>{

        ctx.globalAlpha=p.life/30;

        ctx.fillStyle="#facc15";

        ctx.fillRect(
            p.x,
            p.y,
            5,
            5
        );

    });

    ctx.globalAlpha=1;
}


// ======================
// HUD
// ======================

function drawHUD(){

    ctx.fillStyle="rgba(2,6,23,.8)";
    ctx.fillRect(0,0,W,60);

    ctx.font="bold 22px Arial";

    ctx.fillStyle="white";

    ctx.fillText(
        "คะแนน: "+score,
        20,
        38
    );

    ctx.fillText(
        "❤️ ".repeat(lives),
        250,
        38
    );

    ctx.fillText(
        "ด่าน: "+level,
        480,
        38
    );

    ctx.fillStyle="#67e8f9";

    ctx.fillText(
        "LASER SHOOTER",
        690,
        38
    );
}


// ======================
// Game Loop
// ======================

function loop(){

    if(!running) return;

    update();

    drawBackground();

    drawBullets();

    drawEnemies();

    drawPlayer();

    drawParticles();

    drawHUD();

    requestAnimationFrame(loop);
}


// ======================
// Game Over
// ======================

function gameOver(){

    running=false;

    setTimeout(()=>{

        document.getElementById("menu").innerHTML=`

        <div class="panel">

            <h1>💥 GAME OVER</h1>

            <h2>คะแนนของคุณ</h2>

            <div style="
                font-size:55px;
                color:#facc15;
                font-weight:bold;
            ">
                ${score}
            </div>

            <p>ผ่านไป ${level} ด่าน</p>

            <br>

            <button onclick="startGame()">
                🔄 เล่นอีกครั้ง
            </button>

        </div>

        `;

        document.getElementById("menu").style.display="flex";

    },300);
}


// ======================
// ปรับขนาดจอ
// ======================

function resize(){

    let ratio=W/H;

    let width=window.innerWidth;
    let height=window.innerHeight;

    if(width/height>ratio){

        canvas.style.height=height+"px";
        canvas.style.width=(height*ratio)+"px";

    }else{

        canvas.style.width=width+"px";
        canvas.style.height=(width/ratio)+"px";

    }

}

window.addEventListener("resize",resize);

resize();

</script>

</body>
</html>
